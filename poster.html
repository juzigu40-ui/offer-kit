<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 小单成交包分享海报</title>
    <style>
      :root {
        --ink: #17202a;
        --muted: #657182;
        --line: #dbe1e8;
        --green: #087f5b;
        --blue: #1d4ed8;
        --orange: #b45309;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #eceff3;
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .poster {
        width: min(100vw, 540px);
        aspect-ratio: 4 / 5;
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
        background: #fbfcfd;
        border: 1px solid var(--line);
      }

      .top {
        padding: 34px 34px 0;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--orange);
        font-size: 14px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: 46px;
        line-height: 1.05;
        letter-spacing: 0;
      }

      .body {
        display: grid;
        gap: 18px;
        align-content: center;
        padding: 22px 34px;
      }

      .price {
        color: var(--blue);
        font-size: 44px;
        font-weight: 900;
        line-height: 1;
      }

      .bullets {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        color: var(--muted);
        font-size: 19px;
        list-style: none;
      }

      .bullets li::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 10px;
        border-radius: 999px;
        background: var(--green);
        vertical-align: 2px;
      }

      .bottom {
        display: grid;
        grid-template-columns: 1fr 168px;
        gap: 18px;
        align-items: end;
        border-top: 1px solid var(--line);
        padding: 22px 34px 30px;
        background: #ffffff;
      }

      .link {
        overflow-wrap: anywhere;
        color: var(--green);
        font-size: 16px;
        font-weight: 800;
      }

      .note {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .qr {
        margin: 0;
      }

      .qr img {
        display: block;
        width: 168px;
        height: 168px;
        object-fit: contain;
        border: 1px solid var(--line);
      }

      @media (max-width: 560px) {
        .poster {
          width: 100vw;
          min-height: 100vh;
          aspect-ratio: auto;
        }

        h1 {
          font-size: 40px;
        }

        .bottom {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="poster">
      <section class="top">
        <p class="eyebrow">300 元 / 50 美金数字资料包</p>
        <h1>AI 小单成交包</h1>
      </section>

      <section class="body">
        <div class="price">¥300 / $50</div>
        <ul class="bullets">
          <li>报价页模板</li>
          <li>中英文获客私信</li>
          <li>客户问卷与交付 SOP</li>
          <li>异议处理与复购话术</li>
        </ul>
      </section>

      <section class="bottom">
        <div>
          <div class="link">https://dull-pillows-guess.loca.lt/</div>
          <p class="note">付款后即可打开资料包；不包含收益承诺。</p>
        </div>
        <figure class="qr">
          <img src="./assets/wechat-pay-crop.jpg" alt="微信支付收款二维码" />
        </figure>
      </section>
    </main>
  </body>
</html>
