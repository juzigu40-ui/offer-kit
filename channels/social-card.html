<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>社交卡片 | PR、漏洞报告、小单文案</title>
    <style>
      :root {
        --ink: #17202a;
        --muted: #5f6b7a;
        --line: #d9e0e8;
        --paper: #f6f8fb;
        --surface: #ffffff;
        --green: #087f5b;
        --blue: #1d4ed8;
        --orange: #b45309;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      main {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }

      .card {
        width: min(100%, 760px);
        aspect-ratio: 4 / 5;
        display: grid;
        grid-template-rows: auto 1fr auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: clamp(28px, 6vw, 54px);
        box-shadow: 0 24px 70px rgba(23, 32, 42, 0.12);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--orange);
        font-size: clamp(15px, 2.4vw, 20px);
        font-weight: 900;
        letter-spacing: 0;
      }

      h1 {
        max-width: 620px;
        margin: 0;
        font-size: clamp(42px, 8.2vw, 76px);
        line-height: 1.06;
        letter-spacing: 0;
      }

      .body {
        align-self: end;
      }

      .items {
        display: grid;
        gap: 12px;
        margin: 34px 0 0;
        padding: 0;
        list-style: none;
      }

      .items li {
        display: grid;
        grid-template-columns: 14px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
        color: var(--muted);
        font-size: clamp(18px, 3vw, 24px);
        line-height: 1.36;
      }

      .items li::before {
        content: "";
        width: 10px;
        height: 10px;
        margin-top: 0.48em;
        border-radius: 50%;
        background: var(--green);
      }

      .footer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: end;
        border-top: 1px solid var(--line);
        padding-top: 22px;
      }

      .price {
        color: var(--blue);
        font-size: clamp(28px, 5vw, 44px);
        font-weight: 950;
        line-height: 1;
      }

      .note {
        max-width: 430px;
        margin: 8px 0 0;
        color: var(--muted);
        font-size: clamp(14px, 2.2vw, 18px);
        line-height: 1.4;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        border-radius: 999px;
        background: #e8f5ef;
        color: var(--green);
        padding: 6px 14px;
        font-size: clamp(13px, 2vw, 16px);
        font-weight: 900;
        white-space: nowrap;
      }

      @media (max-width: 560px) {
        main {
          padding: 14px;
        }

        .card {
          width: 100%;
        }

        .footer {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article class="card" aria-label="PR、漏洞报告、小单文案服务卡片">
        <header>
          <p class="eyebrow">PR、漏洞报告、小单文案</p>
          <h1>把事实写清楚，少一点模板味</h1>
        </header>

        <section class="body">
          <ul class="items">
            <li>PR / issue：问题、改动、验证、边界</li>
            <li>漏洞报告：Scope、影响、证据、未做事项</li>
            <li>商品页：交付、价格、材料、限制条件</li>
          </ul>
        </section>

        <footer class="footer">
          <div>
            <div class="price">¥300 / $50 起</div>
            <p class="note">不编验证、不做未授权测试、不承诺成交或赏金。</p>
          </div>
          <div class="badge">先确认范围再付款</div>
        </footer>
      </article>
    </main>
  </body>
</html>
